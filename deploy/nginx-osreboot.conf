# OSreboot behind nginx on the VPS, under /osreboot/.
#
# Put this file into /etc/nginx/snippets/osreboot.conf and add
#     include snippets/osreboot.conf;
# to every server{} the machines and viewers will use:
#   - the default server on port 80: firmware HTTP Boot goes there by IP and without TLS;
#   - the HTTPS server of the domain: iPXE, the recovery environment and the status page.
# A server-level `return 301 https://...` fires before any location: move it into `location /`.
# REMOTE_PORT is the remotePort of the osreboot entry in the FRP client config.

location = /osreboot {
    return 301 /osreboot/;
}

location ^~ /osreboot/ {
    proxy_pass http://127.0.0.1:REMOTE_PORT/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Client-Proto $server_protocol;

    # Images and server-sent events go to the client as they come, without buffering on the VPS.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 1h;
    client_max_body_size 16k;
}
