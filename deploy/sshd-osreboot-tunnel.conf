# /etc/ssh/sshd_config.d/ on the server; the user and its key: see README.md.
# The test system's tunnel may only forward one Unix socket: no shell, no TCP.
# A socket, not a port: the session from before a reset lingers for hours, and
# StreamLocalBindUnlink lets the new connection replace its socket.

Match User osreboot-tunnel
	PasswordAuthentication no
	KbdInteractiveAuthentication no
	# sshd lets a socket be forwarded only where TCP remote forwarding is
	# allowed; PermitListen none then refuses every TCP port.
	AllowTcpForwarding remote
	PermitListen none
	AllowStreamLocalForwarding remote
	StreamLocalBindUnlink yes
	# Mode 0666: nginx, like any local user, may connect, as to a port on
	# 127.0.0.1. The directory decides where the socket can be.
	StreamLocalBindMask 0111
	AllowAgentForwarding no
	X11Forwarding no
	PermitTTY no
	PermitTunnel no
	ForceCommand /usr/sbin/nologin
