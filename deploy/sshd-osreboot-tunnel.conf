# sshd on the server: the user the reverse tunnel of the test system logs in
# as (osreboot-tunnel.service). It may only forward a Unix socket from the
# server back to the test system: no shell, no TCP or other forwarding.
#
# The tunnel is a socket and not a TCP port so that a restored system can take
# it over at once. The system before the restore was reset without closing its
# connection, and sshd keeps that session, with its listener, until TCP
# keepalive ends it after more than two hours (with OpenSSH 9.2 a
# ClientAliveInterval here did not end it). StreamLocalBindUnlink replaces the
# stale socket.
#
# Put this file into /etc/ssh/sshd_config.d/, after the other files there, and
# create the user, its key and the socket directory, see README.md.

Match User osreboot-tunnel
	PasswordAuthentication no
	KbdInteractiveAuthentication no
	# sshd lets a socket be forwarded only where TCP remote forwarding is
	# allowed; PermitListen none then refuses every TCP port.
	AllowTcpForwarding remote
	PermitListen none
	AllowStreamLocalForwarding remote
	StreamLocalBindUnlink yes
	# Mode 0666: nginx, like any local user, may connect, as to a port on
	# 127.0.0.1. The directory decides where the socket can be.
	StreamLocalBindMask 0111
	AllowAgentForwarding no
	X11Forwarding no
	PermitTTY no
	PermitTunnel no
	ForceCommand /usr/sbin/nologin
