# SSH to the test system from outside: port 2221 of the server leads to the
# socket its reverse tunnel opens there (osreboot-tunnel.service).
#     ssh -p 2221 root@example.org
# The server block belongs in the stream {} context of nginx, e.g. in a file
# under /etc/nginx/stream.d/ that nginx.conf includes there.

server {
    listen 0.0.0.0:2221 so_keepalive=on;
    listen [::]:2221 ipv6only=on so_keepalive=on;
    proxy_pass unix:/var/lib/osreboot-tunnel/sock/ssh.sock;
    proxy_connect_timeout 5s;
    proxy_timeout 24h;
    proxy_socket_keepalive on;
}
