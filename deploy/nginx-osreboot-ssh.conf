# Port 2221 leads to the socket of the test system's reverse SSH tunnel:
#     ssh -p 2221 root@example.org
# It goes into the stream {} context of nginx, e.g. /etc/nginx/stream.d/.

server {
    listen 0.0.0.0:2221 so_keepalive=on;
    listen [::]:2221 ipv6only=on so_keepalive=on;
    proxy_pass unix:/var/lib/osreboot-tunnel/sock/ssh.sock;
    proxy_connect_timeout 5s;
    proxy_timeout 24h;
    proxy_socket_keepalive on;
}
