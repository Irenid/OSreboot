# The paper site (README.md as a web page), in /etc/nginx/sites-available/ with
# the name replaced. Files: scripts/deploy-paper.sh. Get the certificate first,
# with only the port 80 server:
#     certbot certonly --webroot -w /var/www/acme -d paper.example.org

server {
    listen 80;
    listen [::]:80;
    server_name paper.example.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name paper.example.org;

    ssl_certificate /etc/letsencrypt/live/paper.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paper.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PaperTLS:1m;
    ssl_session_timeout 1d;

    root /var/www/paper.example.org/html;
    index index.html;
    charset utf-8;
    gzip_types text/css image/svg+xml;

    # The page has no scripts; styles, fonts and images come only from this site.
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # "epoch" = Cache-Control: no-cache, so a new upload shows at once.
    location / {
        expires epoch;
        try_files $uri $uri/ =404;
    }

    location /fonts/ {
        expires 30d;
    }
}
