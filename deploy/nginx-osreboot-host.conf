# OSreboot on its own host name, e.g. https://osreboot.example.org/
#
# Put this file into /etc/nginx/sites-available/, link it from sites-enabled and
# replace osreboot.example.org and REMOTE_PORT. Get the certificate first with only
# the port 80 server enabled:
#     certbot certonly --webroot -w /var/www/acme -d osreboot.example.org
# Firmware HTTP Boot still uses plain HTTP by IP, see nginx-osreboot.conf.

server {
    listen 80;
    listen [::]:80;
    server_name osreboot.example.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name osreboot.example.org;

    ssl_certificate /etc/letsencrypt/live/osreboot.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/osreboot.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:OsrebootTLS:10m;
    ssl_session_timeout 1d;

    location / {
        proxy_pass http://127.0.0.1:REMOTE_PORT;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-Proto $server_protocol;

        # Images and server-sent events go to the client as they come, without buffering on the VPS.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        client_max_body_size 16k;
    }
}
