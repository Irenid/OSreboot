# The recovery environment: a whole system in one UKI that runs from memory.

[Distribution]
Distribution=arch
[Output]
Format=uki
Output=osreboot-recovery
OutputDirectory=mkosi.output
[Content]
Packages=systemd linux linux-firmware-realtek tpm2-tss bash coreutils util-linux gawk
grep sed kmod iproute2 ca-certificates curl zstd e2fsprogs efibootmgr openssh less
KernelModules=default /drivers/net/ethernet/ /drivers/net/phy/ /drivers/net/mdio/
/drivers/net/virtio_net /drivers/char/tpm/ /drivers/nvme/ /fs/ext4/ efivarfs
RemoveFiles=/usr/share/doc /usr/share/man /usr/share/info /usr/share/locale /usr/include
# The network, SSH and service settings of the test system, and the client.
ExtraTrees=../0-test-system/mkosi.extra ../client:/usr/local/lib/osreboot-client
KernelCommandLine=systemd.firstboot=off
Hostname=osreboot-recovery
Locale=C.UTF-8
Keymap=us
Timezone=UTC
RootPassword=hashed:*
Autologin=yes
[Build]
ToolsTree=yes
CacheDirectory=mkosi.cache
