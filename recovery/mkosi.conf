# The recovery environment: a whole system in one unified kernel image, which
# iPXE downloads and starts. It runs from memory, downloads the test system
# images from the OSreboot server and writes them back into the partitions
# labelled osreboot-esp and osreboot-root.
# Site settings (server address, SSH key, the TPM-encrypted token) go to
# mkosi.local.conf, see README.md.

[Distribution]
Distribution=arch

[Output]
Format=uki
Output=osreboot-recovery
OutputDirectory=mkosi.output

[Content]
Packages=
        systemd
        linux
        linux-firmware-realtek
        tpm2-tss
        bash
        coreutils
        util-linux
        gawk
        grep
        sed
        kmod
        iproute2
        ca-certificates
        curl
        zstd
        e2fsprogs
        efibootmgr
        openssh
        less
# The image is downloaded on every recovery: only the drivers it needs.
KernelModules=
        default
        /drivers/net/ethernet/
        /drivers/net/phy/
        /drivers/net/mdio/
        /drivers/net/virtio_net
        /drivers/char/tpm/
        /drivers/nvme/
        /fs/ext4/
        efivarfs
RemoveFiles=
        /usr/share/doc
        /usr/share/man
        /usr/share/info
        /usr/share/locale
        /usr/include
# The same network, SSH and service settings as the test system; the
# recovery service and the client on top.
ExtraTrees=
        ../image/mkosi.extra
        ../client:/usr/local/lib/osreboot-client
KernelCommandLine=systemd.firstboot=off
Hostname=osreboot-recovery
Locale=C.UTF-8
Keymap=us
Timezone=UTC
# Locked: the console on tty1 logs in by itself once the recovery has
# stopped, SSH accepts keys only.
RootPassword=hashed:*
Autologin=yes

[Build]
ToolsTree=yes
CacheDirectory=mkosi.cache
