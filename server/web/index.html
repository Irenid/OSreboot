<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>OSreboot — восстановление системы</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='7' fill='%232f6fed'/%3E%3Cpath d='M15.86 7.4A6 6 0 1 1 8.14 7.4' fill='none' stroke='%23fff' stroke-width='2.2' stroke-linecap='round'/%3E%3Cpath d='M9.83 5.99 6.14 5.95 9.22 9.63Z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<header class="site">
  <div class="brand">
    <div>
      <h1>OSreboot</h1>
    </div>
  </div>
  <div class="controls">
    <p id="link" class="link">Подключение…</p>
    <div class="lang" role="group" aria-label="Язык / Language">
      <button type="button" data-lang="ru">RU</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </div>
</header>
<main class="status">
  <div id="devices"></div>
  <section class="files" aria-labelledby="files-title">
    <div class="section-head">
      <h2 id="files-title">Файлы на сервере</h2>
      <p id="files-url" class="mono"></p>
    </div>
    <p id="files-lead" class="lead">Всё, что ноутбук скачивает для восстановления, в порядке скачивания.</p>
    <ul id="files" class="file-list"></ul>
  </section>
</main>
<footer class="site">
  <a id="source-link" href="https://github.com/Irenid/OSreboot" rel="noopener">Исходный код</a>
  <a id="probe-link" href="probe">Проверка доступа к серверу</a>
</footer>
</body>
</html>
