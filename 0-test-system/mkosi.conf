# The test system the demo wipes and restores, one image per partition.

[Distribution]
Distribution=arch

[Output]
Format=disk
Output=osreboot-test
OutputDirectory=mkosi.output
SplitArtifacts=partitions
CompressOutput=no

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=unsigned
Packages=
        base
        linux
        linux-firmware-realtek
        tpm2-tss
        openssh
        curl
        e2fsprogs
        dosfstools
        efibootmgr
        less
        nano
ExtraTrees=
        ../client:/usr/local/lib/osreboot-client
        ../1-wipe:/usr/local/sbin
KernelCommandLine=root=PARTLABEL=osreboot-root rw systemd.firstboot=off
KernelInitrdModules=default
Hostname=osreboot-test
Locale=C.UTF-8
Keymap=us
Timezone=UTC
RootPassword=hashed:*
Autologin=yes

[Build]
ToolsTree=yes
CacheDirectory=mkosi.cache
