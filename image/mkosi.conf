# The test system the demo wipes and restores: one image file per partition
# (osreboot-esp, osreboot-root). Site settings go to mkosi.local.conf, see README.md.

[Distribution]
Distribution=arch

[Output]
Format=disk
Output=osreboot-test
OutputDirectory=mkosi.output
SplitArtifacts=partitions
CompressOutput=no

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=unsigned
Packages=
        base
        linux
        linux-firmware-realtek
        tpm2-tss
        openssh
        curl
        e2fsprogs
        dosfstools
        efibootmgr
        less
        nano
ExtraTrees=../client:/usr/local/lib/osreboot-client
# The partition is found by its label; it does not have the root type that
# systemd would discover on its own.
KernelCommandLine=root=PARTLABEL=osreboot-root rw systemd.firstboot=off
# The initrd only has to mount the root file system; with all modules the
# unified kernel image is four times larger and the restore downloads it.
KernelInitrdModules=default
Hostname=osreboot-test
Locale=C.UTF-8
Keymap=us
Timezone=UTC
# Locked: the console on tty1 logs in by itself, SSH accepts keys only.
RootPassword=hashed:*
Autologin=yes

[Build]
ToolsTree=yes
CacheDirectory=mkosi.cache
