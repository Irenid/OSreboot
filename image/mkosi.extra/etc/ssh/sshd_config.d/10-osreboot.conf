# Keys only. The authorized key comes from mkosi.local.extra.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
# One host key, the one osreboot-ssh-host-key.service keeps the same across
# restores; the other types would change with every restore.
HostKey /etc/ssh/ssh_host_ed25519_key
