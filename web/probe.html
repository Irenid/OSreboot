<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Access check</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<script type="module" src="probe.js"></script>
</head>
<body>
<main class="narrow">
  <h1>Server access check</h1>
  <p id="origin" class="muted"></p>
  <ol id="checks" class="checks" aria-live="polite"></ol>
  <div class="buttons">
    <button class="primary" id="again">Run again</button>
    <button id="big" title="Uses 100 MB of traffic">100 MB test</button>
    <button id="copy">Copy report</button>
  </div>
  <pre id="report" hidden></pre>
  <details>
    <summary>Check from a terminal</summary>
    <pre id="cli"></pre>
  </details>
</main>
</body>
</html>
