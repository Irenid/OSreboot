<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 636" width="960" height="636" role="img" aria-labelledby="title desc">
<title id="title">Цепочка восстановления OSreboot</title>
<desc id="desc">Схема: 1. osreboot-wipe делает запись iPXE одноразовой, затирает тестовые разделы и сбрасывает машину. 2. Прошивка запускает systemd-boot, он — iPXE, а iPXE по HTTPS скачивает среду восстановления в память. 3. Среда восстановления скачивает образы и SHA256SUMS, сверяет суммы и сообщает серверу этапы. 4. Она пишет образы в тестовые разделы, читает их обратно, ставит BootNext и перезагружает машину. 5. Восстановленная система шлёт heartbeat с новым boot ID, и сервер закрывает простой.</desc>
<defs><marker id="head-net" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#d95926"/></marker><marker id="head-disk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#199e70"/></marker><marker id="head-signal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="#c3c2b7"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="635" rx="12" fill="#1a1a19" stroke="rgba(255,255,255,0.10)"/>
<g font-family="'Adwaita Sans', Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif">
<text x="24" y="40" font-size="17" fill="#f0efec" font-weight="600">Цепочка восстановления: что где лежит и что идёт по сети</text>
<text x="24" y="64" font-size="13" fill="#c3c2b7">Все соединения начинает ноутбук, поэтому ему не нужен публичный адрес</text>
<text x="24" y="98" font-size="12" fill="#898781" font-weight="600" letter-spacing="1">НОУТБУК</text>
<text x="584" y="98" font-size="12" fill="#898781" font-weight="600" letter-spacing="1">VPS: NGINX → СЕРВЕР OSREBOOT (NODE.JS)</text>
<rect x="24" y="112" width="392" height="78" rx="10" fill="#242422" stroke="rgba(255,255,255,0.10)"/>
<rect x="24" y="124" width="4" height="54" rx="2" fill="#3987e5"/>
<text x="40" y="136" font-size="14" fill="#f0efec" font-weight="600">Основной раздел EFI</text>
<text x="402" y="136" font-size="12" fill="#898781" text-anchor="end">затирание не трогает</text>
<text x="40" y="158" font-size="13" fill="#c3c2b7">systemd-boot → одноразовая запись → ipxe.efi</text>
<text x="40" y="177" font-size="13" fill="#c3c2b7">iPXE: свои драйверы, HTTPS, только корни ISRG</text>
<rect x="24" y="206" width="392" height="78" rx="10" fill="#242422" stroke="rgba(255,255,255,0.10)"/>
<rect x="24" y="218" width="4" height="54" rx="2" fill="#d95926"/>
<text x="40" y="230" font-size="14" fill="#f0efec" font-weight="600">Оперативная память</text>
<text x="40" y="252" font-size="13" fill="#c3c2b7">среда восстановления, UKI на 132 MiB:</text>
<text x="40" y="271" font-size="13" fill="#c3c2b7">ищет разделы, качает, сверяет и пишет образы</text>
<rect x="24" y="324" width="392" height="78" rx="10" fill="#242422" stroke="rgba(255,255,255,0.10)"/>
<rect x="24" y="336" width="4" height="54" rx="2" fill="#199e70"/>
<text x="40" y="348" font-size="14" fill="#f0efec" font-weight="600">Тестовые разделы osreboot-esp и osreboot-root</text>
<text x="40" y="370" font-size="13" fill="#c3c2b7">тестовая система: heartbeat, SSH-туннель</text>
<text x="40" y="389" font-size="13" fill="#c3c2b7">и osreboot-wipe, который её затирает</text>
<rect x="24" y="418" width="392" height="40" rx="10" fill="#242422" stroke="rgba(255,255,255,0.10)"/>
<text x="40" y="442" font-size="14" fill="#898781" font-weight="600">Основная система ноутбука</text>
<text x="402" y="442" font-size="12" fill="#898781" text-anchor="end">не трогается</text>
<rect x="584" y="112" width="352" height="172" rx="10" fill="#242422" stroke="rgba(255,255,255,0.10)"/>
<rect x="584" y="124" width="4" height="148" rx="2" fill="#d95926"/>
<text x="600" y="136" font-size="14" fill="#f0efec" font-weight="600">/files — раздача файлов</text>
<text x="600" y="158" font-size="13" fill="#c3c2b7">boot.ipxe — сценарий для iPXE</text>
<text x="600" y="177" font-size="13" fill="#c3c2b7">osreboot-recovery.efi — UKI, 132 MiB</text>
<text x="600" y="196" font-size="13" fill="#c3c2b7">образы разделов .raw.zst — 405 MiB</text>
<text x="600" y="215" font-size="13" fill="#c3c2b7">SHA256SUMS — суммы несжатых образов</text>
<text x="600" y="234" font-size="13" fill="#c3c2b7">диапазоны байтов для докачки</text>
<rect x="584" y="324" width="352" height="78" rx="10" fill="#242422" stroke="rgba(255,255,255,0.10)"/>
<text x="600" y="348" font-size="14" fill="#f0efec" font-weight="600">/api — сигналы машины</text>
<text x="600" y="370" font-size="13" fill="#c3c2b7">heartbeat раз в секунду с boot ID</text>
<text x="600" y="389" font-size="13" fill="#c3c2b7">этапы: wipe, netboot, recovery … reboot</text>
<rect x="584" y="418" width="352" height="58" rx="10" fill="#242422" stroke="rgba(255,255,255,0.10)"/>
<text x="600" y="442" font-size="14" fill="#f0efec" font-weight="600">Замер и показ</text>
<text x="600" y="464" font-size="13" fill="#c3c2b7">outages.csv и страница состояния (SSE)</text>
<line x1="578" y1="151" x2="426" y2="151" stroke="#d95926" stroke-width="2" stroke-linecap="round" marker-end="url(#head-net)"/>
<text x="502.0" y="143" font-size="12" fill="#f0efec" text-anchor="middle">boot.ipxe, UKI</text>
<line x1="578" y1="245" x2="426" y2="245" stroke="#d95926" stroke-width="2" stroke-linecap="round" marker-end="url(#head-net)"/>
<text x="502.0" y="237" font-size="12" fill="#f0efec" text-anchor="middle">образы, SHA256SUMS</text>
<line x1="422" y1="262" x2="574" y2="340" stroke="#c3c2b7" stroke-width="2" stroke-linecap="round" marker-end="url(#head-signal)"/>
<text x="514.0" y="292" font-size="12" fill="#f0efec" text-anchor="middle">этапы</text>
<line x1="422" y1="372" x2="574" y2="372" stroke="#c3c2b7" stroke-width="2" stroke-linecap="round" marker-end="url(#head-signal)"/>
<text x="498.0" y="364" font-size="12" fill="#f0efec" text-anchor="middle">heartbeat</text>
<line x1="764" y1="402" x2="764" y2="414" stroke="#c3c2b7" stroke-width="2" stroke-linecap="round" marker-end="url(#head-signal)"/>
<line x1="220" y1="284" x2="220" y2="320" stroke="#199e70" stroke-width="2" stroke-linecap="round" marker-end="url(#head-disk)"/>
<text x="234" y="307" font-size="12" fill="#f0efec">запись, сверка, BootNext</text>
<circle cx="26" cy="324" r="10" fill="#f0efec" stroke="#1a1a19" stroke-width="2"/>
<text x="26" y="328.5" font-size="12" fill="#1a1a19" font-weight="700" text-anchor="middle">1</text>
<circle cx="26" cy="112" r="10" fill="#f0efec" stroke="#1a1a19" stroke-width="2"/>
<text x="26" y="116.5" font-size="12" fill="#1a1a19" font-weight="700" text-anchor="middle">2</text>
<circle cx="26" cy="206" r="10" fill="#f0efec" stroke="#1a1a19" stroke-width="2"/>
<text x="26" y="210.5" font-size="12" fill="#1a1a19" font-weight="700" text-anchor="middle">3</text>
<circle cx="198" cy="302" r="10" fill="#f0efec" stroke="#1a1a19" stroke-width="2"/>
<text x="198" y="306.5" font-size="12" fill="#1a1a19" font-weight="700" text-anchor="middle">4</text>
<circle cx="444" cy="372" r="10" fill="#f0efec" stroke="#1a1a19" stroke-width="2"/>
<text x="444" y="376.5" font-size="12" fill="#1a1a19" font-weight="700" text-anchor="middle">5</text>
<circle cx="34" cy="507.5" r="10" fill="#f0efec" stroke="#1a1a19" stroke-width="2"/>
<text x="34" y="512.0" font-size="12" fill="#1a1a19" font-weight="700" text-anchor="middle">1</text>
<text x="54" y="512" font-size="13" fill="#c3c2b7">osreboot-wipe делает запись iPXE одноразовой, затирает тестовые разделы и сбрасывает машину.</text>
<circle cx="34" cy="531.5" r="10" fill="#f0efec" stroke="#1a1a19" stroke-width="2"/>
<text x="34" y="536.0" font-size="12" fill="#1a1a19" font-weight="700" text-anchor="middle">2</text>
<text x="54" y="536" font-size="13" fill="#c3c2b7">Прошивка запускает systemd-boot, он — iPXE, а iPXE по HTTPS скачивает среду восстановления в память.</text>
<circle cx="34" cy="555.5" r="10" fill="#f0efec" stroke="#1a1a19" stroke-width="2"/>
<text x="34" y="560.0" font-size="12" fill="#1a1a19" font-weight="700" text-anchor="middle">3</text>
<text x="54" y="560" font-size="13" fill="#c3c2b7">Среда восстановления скачивает образы и SHA256SUMS, сверяет суммы и сообщает серверу этапы.</text>
<circle cx="34" cy="579.5" r="10" fill="#f0efec" stroke="#1a1a19" stroke-width="2"/>
<text x="34" y="584.0" font-size="12" fill="#1a1a19" font-weight="700" text-anchor="middle">4</text>
<text x="54" y="584" font-size="13" fill="#c3c2b7">Она пишет образы в тестовые разделы, читает их обратно, ставит BootNext и перезагружает машину.</text>
<circle cx="34" cy="603.5" r="10" fill="#f0efec" stroke="#1a1a19" stroke-width="2"/>
<text x="34" y="608.0" font-size="12" fill="#1a1a19" font-weight="700" text-anchor="middle">5</text>
<text x="54" y="608" font-size="13" fill="#c3c2b7">Восстановленная система шлёт heartbeat с новым boot ID, и сервер закрывает простой.</text>
</g>
</svg>
